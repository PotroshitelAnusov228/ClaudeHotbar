name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -o "$z"; done || true
          DIR=$(dirname "$(find . -name build.gradle -not -path './.git/*' | head -n1)")
          echo "Project dir: $DIR"
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
      - name: Apply patches
        run: |
          ls -la patch
          test -f patch/InGameHudMixin.java
          test -f patch/KeyboardMixin.java
          cp -f patch/*.java "$PROJECT_DIR/src/main/java/com/example/squarehotbar/mixin/"
          sed -i 's/^mod_version=.*/mod_version=1.1.0/' "$PROJECT_DIR/gradle.properties"
          grep -n "TAIL" "$PROJECT_DIR/src/main/java/com/example/squarehotbar/mixin/InGameHudMixin.java"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 6.8.3
      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          for i in 1 2 3 4; do gradle build && exit 0; echo "retry $i"; sleep 90; done; exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: squarehotbar-mod
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          
